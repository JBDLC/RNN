{% macro radio_cards(field) %}
<div class="radio-cards">
  {% for subfield in field %}
    <label class="radio-card">
      {{ subfield() }}
      <span>{{ subfield.label.text }}</span>
    </label>
  {% endfor %}
</div>
{% if field.errors %}
  {% for error in field.errors %}
    <div class="error">{{ error }}</div>
  {% endfor %}
{% endif %}
{% endmacro %}

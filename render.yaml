# Blueprint Render — déploiement en un clic
# Dashboard Render → New → Blueprint → connecter ce dépôt Git
# Crée automatiquement : service Web + base PostgreSQL + migrations

databases:
  - name: rnn-db
    databaseName: rnn
    user: rnn
    plan: free
    region: frankfurt

services:
  - type: web
    name: rnn-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_APP
        value: run:app
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rnn-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      # BASE_URL : auto via RENDER_EXTERNAL_URL (config.py) si non défini
      - key: BASE_URL
        sync: false
      # --- E-mail (à renseigner dans le dashboard Render après déploiement) ---
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

# Blueprint Render — déploiement en un clic
# Dashboard Render → New → Blueprint → connecter ce dépôt Git
# Crée automatiquement : service Web + base PostgreSQL + migrations au démarrage

databases:
  - name: rnn-db
    databaseName: rnn
    user: rnn
    plan: free
    region: frankfurt

services:
  - type: web
    name: rnn-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Plan gratuit : preDeployCommand non supporté → migrations dans start.sh
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: FLASK_APP
        value: run:app
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rnn-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      # Render gratuit bloque SMTP (ports 587/465) — désactive la validation e-mail pour les tests
      - key: SKIP_EMAIL_VERIFICATION
        value: "true"
      - key: BASE_URL
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
